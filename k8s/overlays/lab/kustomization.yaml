# Lab overlay: what Flux applies (see gitops_path). Environment differences
# live here; the values that come from Terraform are substituted by Flux.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: demo-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
